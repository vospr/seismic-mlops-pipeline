[project]
name = "seismic-mlops-pipeline"
version = "0.2.0"
description = "Facies classification on the public F3 benchmark with a gated MLflow promotion and a served sklearn Pipeline"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { file = "LICENSE" }
dependencies = [
  "numpy>=1.26",
  "scikit-learn>=1.5",
  "mlflow>=3.1",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "pyyaml>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seismic_mlops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
